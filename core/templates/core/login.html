{% extends 'core/base.html' %}
{% block titulo %}Login{% endblock %}

{% block contenido %}
<div class="flex min-h-screen items-center justify-center bg-white-100 p-4">
  <div
    class="w-full max-w-md border-4 border-black bg-white dark:bg-gray-600 text-white p-8 shadow-[12px_12px_0px_0px_rgba(0,0,0,1)]">
    <div class="group mb-8 w-fit cursor-pointer"><h1 class="mb-2 text-3xl font-black uppercase transition-transform duration-300 group-hover:scale-105 md:text-4xl">
        INICIAR SESIÓN</h1>
    <div class="relative"><div class="h-2 w-20 origin-left bg-black transition-all duration-500 ease-out group-hover:w-full dark:bg-white"></div></div></div>

    {% if error %}
    <p class="text-center text-red-300 font-bold text-2xl py-2">{{ error }}</p>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-6">
      {% csrf_token %}
      <div>
        <label for="nombre" class="mb-2 block text-sm font-black dark:text-white text-black"> NOMBRE </label>
        <input
          name="nombre"
          id="nombre"
          type="text"
          class="w-full border-4 border-black px-4 py-2 font-bold focus:outline-none focus:ring-4 focus:ring-blue-300"
          required
        />
      </div>

      <div>
        <label for="contraseña" class="mb-2 block text-sm font-black dark:text-white text-black">
          CONTRASEÑA
        </label>
        <input
          name="contraseña"
          id="contraseña"
          type="password"
          class="w-full border-4 border-black px-4 py-2 font-bold focus:outline-none focus:ring-4 focus:ring-blue-300"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full border-4 dark:text-black border-black bg-blue-300 dark:bg-blue-400 px-6 py-3 text-xl font-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all hover:translate-x-0.5 hover:translate-y-0.5 hover:bg-blue-200 hover:shadow-none active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">
        INICIAR SESIÓN
      </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{% url 'registrar' %}">
            <button class="font-bold dark:text-white text-black underline hover:text-gray-700">
                No tienes una cuenta? REGÍSTRATE
            </button>
        </a>
    </div>
  </div>
</div>
{% endblock %}
