{% extends 'core/base.html' %}
{% block titulo %}Catálogo{% endblock %}

{% block contenido %}



    <h1 class="text-5xl lg:text-7xl font-extrabold tracking-tight text-blue-600 text-center mt-10">
        CATÁLOGO
    </h1>

    <form method="get" class="max-w-4xl mx-auto mb-12 bg-white p-6 rounded-2xl shadow-md border border-gray-100 flex flex-col md:flex-row items-center gap-4">
        
        <input type="text" name="q" value="{{ q }}" placeholder="Buscar" 
            class="w-full md:flex-1 px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black">

        <div class="w-full md:w-auto flex items-center gap-2">
            <label for="categoria" class="text-sm font-semibold text-gray-700 whitespace-nowrap">Categoría</label>
            <select name="categoria" id="categoria" 
                class="w-full sm:w-auto px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-black">
                <option value="">Cualquiera</option>
                {% for c in categorias %}
                    <option value="{{ c.id }}" {% if c.id|stringformat:"s" == categoria_id|stringformat:"s" %}selected{% endif %}>
                        {{ c.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" 
            class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-xl hover:bg-blue-800 transition-colors shadow">
            Aplicar Filtro
        </button>

    </form>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-end justify-center">
        
        {% for patrimonio in patrimonios%}
            <article class="group p-4">
                <div class="aspect-[3/3.5] border-b-6 border-black">
                    <img 
                        src="{{patrimonio.imagen}}" 
                        alt="{{patrimonio.nombre}}" 
                        class="w-full h-full object-cover"
                    />
                </div>
                
                <div class="p-6">
                    <div class="flex items-end justify-between mb-4">
                        <div>
                            <div class="category-tag inline-block mb-2">{{patrimonio.categoria.nombre}}</div>
                            <h3 class="text-2xl font-bold">{{patrimonio.nombre}}</h3>
                        </div>
                    </div>
                    
                    <div class="flex items-end justify-between">
                        <a href="{% url 'detalle_patrimonio' patrimonio.pk %}">
                            <button class="bg-black text-white px-6 py-2 text-sm font-medium hover:bg-gray-800 transition-colors flex items-center space-x-2">
                                <i class="fa-solid fa-circle-info"></i>
                                <span>Ver más</span>
                            </button>
                        </a>
                    </div>
                </div>
            </article>
        {% endfor %}
    </div>

{% endblock %}
